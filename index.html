<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>REPN Inbox</title>
<style>
body{font-family:sans-serif;background:#0c1014;color:#f4ead3;margin:0;padding:16px}
input,textarea,button{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #2a3642;background:#0f151b;color:#f4ead3;font:inherit;box-sizing:border-box}
button{background:#c9a227;color:#1a1408;font-weight:700}
button.bad{background:#5a2a2a;color:#f0c0c0}
button.lock{background:#1d5c45;color:#d6ffe9}
.rowbtns{display:flex;gap:8px}
.rowbtns button{flex:1}
.card{background:#1a232c;padding:14px;border-radius:14px;margin:10px 0}
.tag{display:inline-block;font-size:12px;padding:3px 8px;border-radius:99px;background:#332614;color:#f0c27a;margin-bottom:6px}
h1{font-size:22px;margin:0 0 8px}
small{color:#8b9aab}
</style>
</head>
<body>
<h1>REPN · วางโพสต์กลุ่ม</h1>
<p id="st">วางคีย์ครั้งเดียว ครั้งถัดไปจะจำให้</p>
<div class="card">
<input id="url" value="https://qxebmvacglridoqyjoeb.supabase.co"/>
<textarea id="key" rows="3" placeholder="anon key eyJ..."></textarea>
<button type="button" id="b1">บัทึกคีย์และดึงคิว</button>
</div>
<div class="card">
<input id="fburl" placeholder="ลิงก์โพสต์เฟซ (ถ้ามี)"/>
<textarea id="raw" rows="7" placeholder="วางข้อความโพสต์จากกลุ่ม"></textarea>
<button type="button" id="bPaste">ส่งเข้าคิว PENDING_VERIFY</button>
</div>
<div id="list"></div>
<script>
var LS="repn_sb";
function toast(m){document.getElementById("st").textContent=m}
function base(){return document.getElementById("url").value.trim().replace(/\/$/,"").replace(/\/rest\/v1.*/,"")}
function anon(){return document.getElementById("key").value.trim()}
function saveCfg(){try{localStorage.setItem(LS,JSON.stringify({url:base(),key:anon()}))}catch(e){}}
function loadCfg(){
  try{
    var c=JSON.parse(localStorage.getItem(LS)||"{}");
    if(c.url) document.getElementById("url").value=c.url;
    if(c.key) document.getElementById("key").value=c.key;
    return !!(c.key);
  }catch(e){return false}
}
function headers(){var k=anon();return {apikey:k,Authorization:"Bearer "+k,"Content-Type":"application/json",Prefer:"return=representation"}}
function baht(n){return Number(n||0).toLocaleString("th-TH")}
async function api(path,opt){
  var res=await fetch(base()+"/rest/v1/"+path,Object.assign({headers:headers()},opt||{}));
  var txt=await res.text(); var data=null; try{data=txt?JSON.parse(txt):null}catch(e){data=txt}
  return {ok:res.ok,txt:txt,data:data};
}
function parsePost(text, link){
  var t=text||"";
  var type="อื่น";
  if(/ที่ดิน|วงผัง|ริมทาบ/.test(t)) type="ที่ดิน";
  else if(/คอนโด/.test(t)) type="คอนโด";
  else if(/ทาวน์/.test(t)) type="ทาวน์โฮม";
  else if(/บ้าน/.test(t)) type="บ้าน";
  var listing=/เช่า|รายเดือน/.test(t)?"RENT":"SALE";
  var price=0, m=t.match(/(\d[\d,]*(?:\.\d+)?)\s*(ล้าน|ลบ\.?)/);
  if(m) price=parseFloat(m[1].replace(/,/g,""))*1000000;
  else { m=t.match(/(\d[\d,]{4,})\s*บาท/); if(m) price=parseFloat(m[1].replace(/,/g,"")); }
  var zone=""; var z=t.match(/(?:ที่|ทำเล|เขต|อำเภอ|บาง)([^\n,]{2,24})/);
  if(z) zone=z[0].replace(/\s+/g," ").slice(0,40);
  return {title:(t.split(/\n/)[0]||type).slice(0,80), listing_type:listing, property_type:type, sale_price: listing==="SALE"?price:0, rent_price_monthly: listing==="RENT"?price:0, location_zone:zone, facebook_post_url:link||("local://paste-"+Date.now()), status:"PENDING_VERIFY"};
}
async function pasteIn(){
  if(!anon()){toast("วาง anon key ก่อน");return}
  saveCfg();
  var raw=document.getElementById("raw").value.trim();
  if(!raw){toast("วางข้อความโพสต์ก่อน");return}
  var row=parsePost(raw, document.getElementById("fburl").value.trim());
  var r=await api("properties",{method:"POST",body:JSON.stringify(row)});
  if(!r.ok){toast(r.txt.slice(0,240));return}
  toast("เข้าคิวแล้ว"); document.getElementById("raw").value=""; pull();
}
async function pull(){
  if(!anon()){toast("วาง anon key ก่อน");return}
  saveCfg();
  var r=await api("properties?select=*&order=created_at.desc&limit=30");
  if(!r.ok){toast(r.txt.slice(0,220));return}
  var box=document.getElementById("list");
  box.innerHTML=(r.data||[]).map(function(x){
    return "<div class=card><span class=tag>"+x.status+"</span><h3>"+(x.title||"-")+"</h3><p>"+(x.property_type||"")+" · "+(x.location_zone||"-")+"<br>"+baht(x.sale_price)+" บาท</p>"+
      "<div class=rowbtns><button type=button data-act=pub data-id=\""+x.id+"\">อนุมัติ</button><button type=button class=bad data-act=rej data-id=\""+x.id+"\">Reject</button></div>"+
      "<button type=button class=lock data-act=esc data-id=\""+x.id+"\" data-price=\""+x.sale_price+"\">ล็อกเอสโครว์ 3%</button></div>";
  }).join("");
  box.onclick=function(e){
    var t=e.target.closest("button"); if(!t) return;
    var act=t.getAttribute("data-act"); if(!act) return;
    if(act==="pub") setStatus(t.getAttribute("data-id"),"PUBLISHED");
    if(act==="rej") setStatus(t.getAttribute("data-id"),"REJECTED");
    if(act==="esc") lockEscrow(t.getAttribute("data-id"),t.getAttribute("data-price"));
  };
  toast("จำคีย์แล้ว · คิว "+(r.data||[]).length+" รายการ");
}
async function setStatus(id,status){
  var r=await api("properties?id=eq."+id,{method:"PATCH",body:JSON.stringify({status:status})});
  toast(r.ok?status:r.txt.slice(0,200)); if(r.ok) pull();
}
function parts(price){
  var p=Number(price||0), tot=p*0.03, firm=p*0.005, pool=p*0.025;
  return {price:p,tot:tot,firm:firm,pool:pool,rows:[
    {role:"COMPANY",pct:0.5,amount:firm},{role:"LISTING",pct:0.625,amount:pool*0.25},
    {role:"SELLING",pct:0.875,amount:pool*0.35},{role:"SPONSOR",pct:0.25,amount:pool*0.10},
    {role:"UNILEVEL",pct:0.625,amount:pool*0.25},{role:"LEADERSHIP",pct:0.125,amount:pool*0.05}
  ]};
}
async function lockEscrow(pid,price){
  var c=parts(price); if(!c.price){toast("ไม่มีราคา");return}
  var acc=await api("escrow_accounts",{method:"POST",body:JSON.stringify({property_id:pid,deal_price:c.price,commission_rate:3,total_commission:Math.round(c.tot*100)/100,company_share:Math.round(c.firm*100)/100,affiliate_pool:Math.round(c.pool*100)/100,status:"FUNDED",funded_at:new Date().toISOString()})});
  if(!acc.ok){toast(acc.txt.slice(0,240));return}
  var id=acc.data[0].id;
  for(var i=0;i<c.rows.length;i++){
    var s=c.rows[i];
    var rr=await api("escrow_splits",{method:"POST",body:JSON.stringify({escrow_id:id,role:s.role,share_pct:s.pct,amount:Math.round(s.amount*100)/100,status:"LOCKED"})});
    if(!rr.ok){toast(rr.txt.slice(0,240));return}
  }
  await api("properties?id=eq."+pid,{method:"PATCH",body:JSON.stringify({status:"RESERVED"})});
  toast("ล็อกเอสโครว์ "+baht(c.tot)); pull();
}
document.getElementById("b1").onclick=pull;
document.getElementById("bPaste").onclick=pasteIn;
if(loadCfg()) pull();
</script>
</body>
</html>
